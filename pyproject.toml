[project]
name = "magicboxie-device"
version = "0.1.0"
description = "MagicBoxie device daemon: BLE GATT control surface driving mpv for HDMI playback"
requires-python = ">=3.9"
dependencies = [
    "bluez-peripheral>=0.1.7",
    "aiohttp>=3.9",
    "Pillow>=10.0",
    "evdev>=1.6",
    "zeroconf>=0.132",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "aioresponses>=0.7",
    # aioresponses 0.7.9 (its latest release) monkey-patches
    # aiohttp.ClientResponse in a way that broke against aiohttp 3.14's
    # now-required-keyword-only stream_writer param - confirmed 3.13.2
    # still works, 3.14.3 doesn't. Only constrains the dev/test install
    # ([dev] extra) - the app itself still takes any aiohttp>=3.9.
    "aiohttp<3.14",
]

[project.scripts]
magicboxie-device = "player_app.main:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["player_app*", "pi*"]

[tool.setuptools.package-data]
"pi.web" = ["*.html", "static/*"]
