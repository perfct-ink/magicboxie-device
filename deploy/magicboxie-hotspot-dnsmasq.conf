# Dedicated, offline DNS/DHCP on the device Wi-Fi only.
# Bind only the AP address, so switching wlan0 to saved Wi-Fi over BLE
# cannot make captive DNS answer on the home network.
listen-address=10.42.0.1
bind-dynamic
no-resolv
no-hosts
address=/#/10.42.0.1
# Also answer non-A queries locally instead of forwarding them upstream.
local=/#/
dhcp-authoritative
dhcp-range=10.42.0.10,10.42.0.250,255.255.255.0,12h
dhcp-option=3,10.42.0.1
dhcp-option=6,10.42.0.1
dhcp-leasefile=/var/lib/magicboxie-hotspot/dnsmasq.leases
log-facility=-
