services:
  magicboxie-player:
    build:
      context: .
      target: base  # the Dockerfile's `test` stage is defined after `base`, so this must be explicit
    restart: unless-stopped
    # BlueZ D-Bus and DRM/KMS video output are host resources - this container
    # is intentionally not isolated from them. `privileged` + `network_mode: host`
    # is the pragmatic way to get both working without hand-tuning device
    # cgroup rules and capability sets; fine for a single-purpose home device,
    # worth revisiting if this ever needs to run somewhere less trusted.
    privileged: true
    network_mode: host
    volumes:
      - /var/run/dbus:/var/run/dbus
      # Writable now (was :ro) - POST /movies (shared-into-the-app uploads
      # from iOS) needs to write new files into this directory.
      - ${MAGICBOXIE_MOVIES_DIR:-./movies}:/movies
      - thumbnails:/var/lib/magicboxie/thumbnails
    environment:
      # "http" here by default since there's no BlueZ on macOS/Docker Desktop -
      # this compose file is what you run for local dev. Set to "ble" (e.g. a
      # .env file or `MAGICBOXIE_TRANSPORT=ble docker compose up`) on the real
      # Pi deployment to get the actual BLE GATT service.
      MAGICBOXIE_TRANSPORT: ${MAGICBOXIE_TRANSPORT:-http}
      # Uncomment to override the default `--vo=gpu --gpu-context=drm` mpv output
      # args baked into the image (e.g. to pin a specific --drm-connector).
      # MAGICBOXIE_MPV_ARGS: "--vo=gpu --gpu-context=drm --drm-connector=HDMI-A-1"

volumes:
  thumbnails:
